<!DOCTYPE html>
<html lang="en">
<head>

<title>Built to Last</title>

<style>
:root{--bg:#0a0a0a;--s:#161616;--s2:#1f1f1f;--line:#2a2a2a;--ink:#f2f2f2;--mute:#9a9a9a;--gold:#bfa36e;--goldsoft:#bfa36e22;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{background:#0a0a0a}
body{margin:0 auto;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif;max-width:560px;padding:16px 16px 104px}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.02em}
h1{font-size:46px;line-height:.95;font-weight:700}h2{font-size:28px;margin:22px 0 8px;font-weight:700}h3{font-size:21px;font-weight:600}
p{margin:0}.mute{color:var(--mute);font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 16px;background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary,.gold{background:var(--gold);color:#0a0a0a;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--s2);font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft);color:var(--gold)}
.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.card.done{border-color:var(--gold);background:var(--goldsoft)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.link{display:block;width:100%;text-align:left;padding:0;min-height:0;font:700 21px "Barlow Condensed",sans-serif;color:var(--ink)}
.check{width:44px;height:44px;flex:none;border:2px solid var(--line);border-radius:50%;font-size:20px;font-weight:700;color:#0a0a0a;padding:0}
.done .check{background:var(--gold);border-color:var(--gold)}
label{display:block;margin-top:14px;font-size:14px;color:var(--mute)}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--s);margin-top:6px}
textarea{resize:vertical}
.w{display:flex;align-items:center;gap:8px;margin:0;font-size:14px}.w input{width:90px;margin:0}
.cb{display:inline-flex;align-items:center;gap:8px;margin:0;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--s);color:var(--ink);font-size:15px}
.cb input{width:auto;min-height:0;margin:0;accent-color:#bfa36e}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;border-radius:0;min-height:56px;font-weight:600;color:var(--mute)}
nav button[aria-current="page"]{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--goldsoft);color:var(--gold);font-size:13px;font-weight:600}
.flag{display:block;margin-top:4px;color:#ff7a59;font-size:13px;font-weight:600}
.imgs{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.imgs img{height:200px;max-width:80%;border-radius:14px;background:var(--s2);flex:none}
ol{padding-left:22px;margin:8px 0}ol li{margin-bottom:8px}
.tip{border-left:3px solid var(--gold);background:var(--s);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:14px;font-size:15px}
.log{border-bottom:1px solid var(--line);padding:10px 0}
.stat{display:flex;gap:12px;margin:14px 0}.stat div{flex:1;background:var(--s);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.wk button{padding:8px 0;min-height:64px;border:1px solid var(--line);background:var(--s);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute)}.wk b{font:700 17px "Barlow Condensed",sans-serif;color:var(--ink)}.wk button[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}.wk .today b{color:var(--gold)}.wk .fin span{color:var(--gold)}
.stat b{font:700 36px/1 "Barlow Condensed",sans-serif;display:block}
#rest{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:#1f1f1f;border-top:1px solid var(--gold);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
#rest[hidden]{display:none}#rest b{font:700 22px "Barlow Condensed",sans-serif;margin-left:6px}
#rest.flash{background:var(--gold);color:#0a0a0a}#rest.flash .chip{color:var(--ink)}
.sr{display:flex;align-items:center;gap:8px;margin-top:10px}.sr span{width:42px;flex:none}.sr input{margin:0;flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.brand .mk{width:46px;height:46px;flex:none}
.brand h1{font:400 12px/1.2 Michroma,"Barlow Condensed",sans-serif;letter-spacing:.26em;color:var(--gold);text-transform:uppercase}
#wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;opacity:.06}#wm svg{width:min(125vw,640px);height:auto}
main{position:relative;z-index:1}nav{z-index:6}
.why{margin:2px 0 0;font-size:15px;color:var(--mute)}
.quote{margin-top:14px;font-style:italic;color:var(--mute);font-size:14px}.quote b{color:var(--gold);font-style:normal;font-size:18px}
.sub{margin:16px 0 4px;font:600 13px Barlow,sans-serif;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.chip:disabled{opacity:.4;cursor:default}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;box-sizing:border-box}
[hidden]{display:none!important}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:8px}.rn{display:flex;justify-content:space-between;font-size:14px}.rb{height:8px;border-radius:4px;background:var(--s2);margin-top:4px;overflow:hidden}.rb i{display:block;height:100%;border-radius:4px}
.mr{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}.mr:last-child{border-bottom:0}
.ssg{border:1px solid var(--gold);border-radius:18px;padding:8px 8px 0;margin-bottom:10px}.ssg .card{margin-bottom:8px}.sslab{font:600 11px/1 Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:4px 6px 8px}
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;cursor:pointer;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .spq{font-family:"Barlow Condensed",Impact,sans-serif;font-size:40px;line-height:1.1;letter-spacing:.02em;font-weight:600;margin:0}
#splash .spq b{display:block;margin-top:14px;color:var(--gold);font-weight:700}
#splash .spt{margin:28px 0 0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}details summary{cursor:pointer;font-weight:600;list-style:none}details summary::-webkit-details-marker{display:none}details summary::before{content:"+ ";color:var(--gold)}details[open] summary::before{content:"− "}
a.chip{display:inline-flex;align-items:center;border-radius:12px;min-height:44px;padding:0 16px;color:var(--ink);text-decoration:none;background:var(--s2)}
</style>
</head>

<script>
const REMOTE="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";
const IMG="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
const mk=(id,name,eq,pm,sm,lv,mech,ins)=>({id,name,equipment:eq,primaryMuscles:pm,secondaryMuscles:sm,level:lv,mechanic:mech,category:"strength",instructions:ins,images:[]});
const FB=[
mk("lat","Wide-Grip Lat Pulldown","cable",["lats"],["biceps","middle back"],"beginner","compound",["Sit down and lock your thighs under the pad.","Grab the bar a little wider than your shoulders, palms facing away.","Lean back slightly, chest up, and pull the bar to your upper chest.","Let it rise slowly until your arms are straight. Do not swing."]),
mk("row","Seated Cable Row","cable",["middle back"],["lats","biceps"],"beginner","compound",["Sit with feet on the plates and knees slightly bent.","Keep your back straight and pull the handle to your belly.","Squeeze your shoulder blades, then return slowly."]),
mk("curl","Dumbbell Bicep Curl","dumbbell",["biceps"],["forearms"],"beginner","isolation",["Stand tall with a dumbbell in each hand, palms forward.","Curl up without swinging, keeping elbows by your sides.","Lower slowly to the start."]),
mk("push","Push-Up","body only",["chest"],["triceps","shoulders"],"beginner","compound",["Hands slightly wider than shoulders, body in a straight line.","Lower your chest toward the floor, then press back up.","Do them from your knees or against a bench if needed."]),
mk("bench","Dumbbell Bench Press","dumbbell",["chest"],["triceps","shoulders"],"beginner","compound",["Lie on a bench with a dumbbell in each hand over your chest.","Lower them to chest level with elbows about 45 degrees from your body.","Press back up without locking out hard."]),
mk("pd","Triceps Pushdown","cable",["triceps"],[],"beginner","isolation",["Stand facing the cable with elbows tucked at your sides.","Push the handle down until your arms are straight.","Let it rise slowly, keeping elbows still."]),
mk("goblet","Goblet Squat","dumbbell",["quadriceps"],["glutes"],"beginner","compound",["Hold one dumbbell against your chest.","Sit down and back, keeping your chest up and heels flat.","Stand up by pushing through your whole foot."]),
mk("lp","Leg Press","machine",["quadriceps"],["glutes","hamstrings"],"beginner","compound",["Sit with feet shoulder width on the platform.","Lower until knees bend about 90 degrees.","Press up without locking your knees."]),
mk("rdl","Dumbbell Romanian Deadlift","dumbbell",["hamstrings"],["glutes","lower back"],"beginner","compound",["Stand holding dumbbells in front of your thighs.","Push your hips back with a flat back and soft knees.","Lower to mid-shin, then squeeze your glutes to stand."]),
mk("ohp","Dumbbell Shoulder Press","dumbbell",["shoulders"],["triceps"],"beginner","compound",["Hold dumbbells at shoulder height, seated or standing.","Press straight overhead.","Lower under control to the start."]),
mk("plank","Plank","body only",["abdominals"],["lower back"],"beginner","isolation",["Rest on your forearms with elbows under shoulders.","Keep your body in one straight line and tighten your core.","Hold, breathing steadily."]),
mk("calf","Standing Calf Raise","body only",["calves"],[],"beginner","isolation",["Stand tall, holding a wall for balance.","Rise onto your toes, then lower slowly."])];
const DAYS={"Back and biceps":["lats","middle back","lats","biceps","traps","biceps"],"Chest and triceps":["chest","chest","shoulders","triceps","chest","triceps"],"Legs and glutes":["quadriceps","hamstrings","glutes","quadriceps","calves","hamstrings"],"Shoulders and core":["shoulders","abdominals","shoulders","lower back","abdominals"],"Full body":["quadriceps","chest","lats","shoulders","hamstrings","abdominals"],"Push":["chest","shoulders","chest","triceps","shoulders","triceps"],"Pull":["lats","middle back","lats","biceps","middle back","biceps"],"Legs":["quadriceps","hamstrings","glutes","quadriceps","calves","hamstrings"]};
const CUST={chest:["chest","chest"],back:["lats","middle back"],shoulders:["shoulders","shoulders"],legs:["quadriceps","hamstrings","glutes"],arms:["biceps","triceps"],core:["abdominals","lower back"]};
const CUSTL={chest:"Chest",back:"Back",shoulders:"Shoulders",legs:"Legs",arms:"Arms",core:"Core",fullbody:"Full body"};
const MUS=["abdominals","biceps","calves","chest","forearms","glutes","hamstrings","lats","lower back","middle back","quadriceps","shoulders","traps","triceps"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>String(s||"").replace(/\b\w/g,c=>c.toUpperCase());
let DB=FB,BY={},S={tab:"train",prof:null,logs:[],week:null,sel:null,det:null,q:"",mu:"",lim:30,edit:false,note:"Starter set",hist:{},bw:[],fav:[],never:[],rest:null,swaps:{},block:null,comp:{},logSeq:0,lastBackup:null,bkSnooze:null,editLog:null,showPR:null,addPick:false,paq:"",swapPick:null,sq:"",always:[],exNotes:{},noteOpen:null,mvOpen:null,whyOpen:{},helpOpen:false,logAll:false,ch:null,pmu:"",plim:40,cust:null,scrollBack:null,custom:[],howOpen:{},guide:false,goFaq:false};
const idx=()=>{(S.custom||[]).forEach(c=>{if(!DB.some(e=>e.id===c.id))DB.push(c)});BY={};DB.forEach(e=>{e.pat=pat(e);BY[e.id]=e})};
function load(){try{const d=JSON.parse(localStorage.getItem("wk3")||"null");if(d){S.prof=d.prof||null;S.logs=d.logs||[];S.week=d.week||null;S.hist=d.hist||{};S.bw=d.bw||[];S.fav=d.fav||[];S.never=d.never||[];S.swaps=d.swaps||{};S.block=d.block||null;S.comp=d.comp||{};S.logSeq=d.logSeq||0;S.lastBackup=d.lastBackup||null;S.always=d.always||[];S.exNotes=d.exNotes||{};S.custom=d.custom||[]}}catch(e){}}
function save(){try{localStorage.setItem("wk3",JSON.stringify({prof:S.prof,logs:S.logs,week:S.week,hist:S.hist,bw:S.bw,fav:S.fav,never:S.never,swaps:S.swaps,block:S.block,comp:S.comp,logSeq:S.logSeq,lastBackup:S.lastBackup,always:S.always,exNotes:S.exNotes,custom:S.custom}))}catch(e){}}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();if(!Array.isArray(j)||!j.length)throw 0;return j}
async function loadDB(){
  let j=null,src="";
  for(const [u,n] of [["exercises.json","Local file"],[REMOTE,"Open database"]]){try{j=await getJSON(u);src=n;break}catch(e){}}
  if(j){try{localStorage.setItem("fwdb",JSON.stringify(j))}catch(e){}}
  else{try{j=JSON.parse(localStorage.getItem("fwdb")||"null");src="Saved copy"}catch(e){}}
  if(!(j&&j.length)){j=FB;src="Starter set (offline)"}
  DB=j;S.note=src+" · "+DB.length+" exercises";idx();render();
}
const GOALS=[["Strength",/strong|strength|power|heavy/i,4,"5–8"],["Muscle",/muscle|build|bulk|size|mass|hypertroph/i,3,"8–12"],["Fat loss",/lose|\bfat\b|\blean\b|\btone\b|slim|weight loss|\bcut\b/i,3,"12–15"],["Endurance",/\brun|marathon|endur|cardio|stamina|5k|10k/i,2,"12–15"],["Posture and back",/posture|\bback\b|mobil|flexib|pain|stiff/i,2,"10–12"]];
const goals=t=>{const m=GOALS.filter(g=>g[1].test(t||""));return m.length?m:[["General health",null,2,"10–12"]]};
const gchips=t=>goals(t).map(g=>`<span class="tag">${g[0]}</span>`).join("");
const mus=e=>[...e.primaryMuscles,...(e.secondaryMuscles||[])];
const INJ={"lower back":e=>/deadlift|good.?morning|bent.?over|stiff.?leg|clean|snatch|jerk|jump|hyperextension|sit.?up/i.test(e.name)||e.category==="plyometrics"||(e.equipment==="barbell"&&(/squat/i.test(e.name)||mus(e).includes("lower back"))),
"knees":e=>/jump|lunge|pistol|sissy|leg extension|\bbox\b|burpee|step.?up/i.test(e.name)||e.category==="plyometrics"||(e.equipment==="barbell"&&/squat/i.test(e.name)),
"shoulders":e=>/behind.?the.?neck|upright row|\bdips?\b|snatch|jerk|military/i.test(e.name)||(e.equipment==="barbell"&&/overhead|shoulder press/i.test(e.name)),
"wrists":e=>/push.?up|front squat|handstand|wrist/i.test(e.name)||(e.equipment==="barbell"&&/curl/i.test(e.name)),
"neck":e=>/behind.?the.?neck|neck|bridge/i.test(e.name)||(e.equipment==="barbell"&&/shrug/i.test(e.name)),
"hips":e=>/sumo|deep squat|wide.?stance|wide.?squat|adduct|abduct|hip thrust|lunge|split squat/i.test(e.name)};
const AV={"spine":e=>/deadlift|good.?morning|bent.?over|stiff.?leg|clean|snatch|jerk/i.test(e.name)||(e.equipment==="barbell"&&/squat/i.test(e.name)),
"overhead":e=>/overhead|shoulder press|military|arnold|push press|handstand|snatch|jerk/i.test(e.name),
"impact":e=>e.category==="plyometrics"||/jump|burpee|\bbox\b|\bhop|skip|sprint|bound/i.test(e.name),
"knees":e=>/squat|lunge|pistol|sissy|step.?up/i.test(e.name)&&!/leg press/i.test(e.name),

const FAQ=[
["The basics",[
["Where do I find instructions for the app?","Tap Guide at the top right of any screen. It has a quick start, an explanation of every button, and how running, Progress, and the Library work. Help & FAQ (bottom of Profile) answers specific questions."],
["What is this app?","Built to Last is a personal workout planner. It builds you a week of lifting and running based on your goals, experience and schedule, then tracks what you log so the plan adjusts over time."],
["Who is it for?","Anyone who wants a structured plan without hiring a coach, from someone just starting out to an experienced lifter or runner. You set your own goals and limits, and the app builds around them."],
["Does it cost anything? Are there ads?","No. It's free to use with no ads and no account to create."],
["Where is my data stored?","Everything, your profile, logs, history and settings, is saved only on your phone, in the browser's local storage. Nothing is sent to a server. That's also why backups (below) matter if you get a new phone."]
]],
["How the plan is built",[
["How does the app decide my workouts?","It looks at your goals, experience level, injuries, available days and session length, then builds a week of lifts and runs around them. It also looks at what you've logged recently to suggest weights and adjust volume."],
["What are Heavy, Moderate, and Light days?","Three ways to lift the same exercises. Heavy days use fewer reps, more sets and longer rest to build strength. Light days use more reps, fewer sets and shorter rest to build endurance and ease recovery. Moderate sits in between. The app rotates these through your week, and you can change any day's type yourself."],
["What are focus areas and how do they change my plan?","Up to three muscle groups you want extra attention on, set in Profile. The app adds sets to those muscles on non-heavy days, within your session time, and shows you planned versus target sets."],
["What is a 4-week block and why does it reset?","Your main lifts stay the same for 4 weeks so you can see them get a little easier over time, which is how you know you're getting stronger. Week 4 is a lighter recovery week. After that, a new block starts, sometimes with new main lifts."],
["Why did my long run move, or why is the day before it light?","The app avoids putting a long or hard run right after a heavy leg day. If your chosen long-run day would land on or after a heavy leg session, it lightens that lift day instead of moving your run, so your legs are fresher."]
]],
["Using it during a workout",[
["How do I see how to do an exercise?","Tap the \"How to\" button on any lift. The steps, photos and a link to a demo video open right on your workout. \"More details\" opens the full page, and Back takes you right to where you were."],
["How do I log a set?","Enter the weight and reps (both are usually filled in for you already) and tap the circle next to the set to mark it done. The rest timer starts automatically."],
["What is the rest timer doing?","It counts down the rest time for the day's intensity, 2–3 minutes on Heavy days, about 90 seconds on Moderate, and about a minute on Light. You can add 15 seconds, skip it, or turn it off from the timer bar. If you don't want it at all, switch off \"Rest timer after each set\" in Profile."],
["How do Swap, Add, and the ✕ button work?","Swap opens a searchable list of alternative exercises for that slot. The ✕ removes an exercise from today's session only. \"+ Add an exercise\" lets you add something extra to today's workout. None of these change next week's plan."],
["What is a superset?","Pairing two exercises so you do a set of one, then a set of the other, with rest only after the second. Tap \"Pair with next\" on a lift to set it up, and \"Unpair\" to undo it."],
["How do I change what's planned for a day?","On Train, tap \"Change this day\" on any day you haven't started. You can turn a lift into a run, add a workout on an open day, make any day a rest day, or do a lift and a run together. It only changes this week; next week builds fresh from your profile."],
["How do I add sets, repeat a lift, or add one that's missing?","Under each lift, tap \"+ Set\" to add a set (or \"\u2212 Set\" to remove an unlogged one). \"Repeat\" adds the same lift again as a second round. \"+ Add an exercise\" searches the whole library, and if a lift still isn't there, tap \"Add your own exercise\" to create it."],
["How do I move a workout to another day?","On an unstarted workout, tap \"Move to another day\" and choose where it goes. If that day already has a workout, the two swap. This only affects the current week."],
["How do I log a workout from a past day?","On the Progress tab, tap \"Log past workout\" to add one you forgot to record, with its own date, type and distance."]
]],
["Favorite, Always include, and Never show",[
["What's the difference between Favorite and Always include?","Favorite nudges the app to pick that exercise more often, but it still rotates with other options for variety. Always include skips the rotation entirely: whenever a day calls for that muscle group and the exercise fits, it's used."],
["How do I stop the app from giving me a specific exercise?","Open it from the Library and tap \"Never show me this.\" It'll be left out of every future plan."]
]],
["Running",[
["How does the app pick my mileage?","From your running experience, your goal (just staying active, a target weekly mileage, or a race distance) and how many days you run. It starts from your current mileage and increases gradually rather than jumping straight to a target."],
["Why does the plan hold my current miles instead of cutting them?","If you already run more than a goal needs, dropping you down would be a step backward. The app keeps your current mileage unless you check \"Reduce my mileage toward this goal\" in Profile."],
["What is a taper week?","The week or two right before a race, where mileage drops on purpose so your legs are fresh and recovered for race day instead of tired from training."],
["Why do my runs show minutes instead of miles?","For brand-new runners, the app uses run/walk time targets instead of a mileage target, which is the more common way to start running. You can still log the actual miles you covered."]
]],
["Progress and personal records",[
["How are PRs detected?","After you finish a workout, the app compares it with your history: a new heaviest weight on a lift, your longest run, or your fastest pace all count as a personal record and show a gold banner."],
["What is the Muscle recovery map telling me?","An estimate, not a measurement, of how fresh each muscle group is based on what you've logged in the last few days. It fades back toward 100% over 2–3 days. It's there for context and doesn't change your plan."],
["What counts as a week trained?","Training on at least 80% of the days your plan scheduled that week. Missing one day here and there is fine; the streak just needs most of the planned days."]
]],
["Backup, updates, and installing",[
["How do I back up my data?","In Profile, under Backup, tap \"Back up to Files.\" On an iPhone, choose \"Save to Files\" and pick iCloud Drive, which keeps a copy safe if you lose your phone."],
["How do I restore from a backup?","In Profile, under Backup, tap \"Restore from file\" and choose your saved backup file. This replaces everything currently on the phone, so only do it if that's what you want."],
["How do I install this on my phone?","Open the app's link in Safari (not Chrome, iOS requires Safari for this), tap the Share button, then \"Add to Home Screen.\" It'll behave like a regular app from there."],
["How do I know when the app updates?","It checks for a new version each time it's opened. If an update doesn't seem to show up, fully close the app (swipe it away, don't just switch apps) and reopen it."]
]],
["Troubleshooting",[
["My workouts all look the same, what gives?","Check your lift split in Profile. \"Full body\" means every session works your whole body, which is normal and effective, just repetitive-looking. Try Upper/Lower, Push/Pull/Legs, Body-part split, or Pick your own for more variety day to day."],
["My Heavy day runs over my session time, why?","The app trims sets and exercises to fit your session length, but it won't cut a main lift below 3 sets just to save a few minutes. Heavy days can run a little over your target time for that reason, it'll never swing wildly over."],
["Why does the app think I weigh nothing?","It doesn't track body weight at all anymore, that section was removed. Weight suggestions for lifts come from your exercise history, not your body weight."],
["What should I do if something looks wrong?","Check this FAQ and the \"Why this workout?\" panel on Train first, since a lot of behavior that looks like a bug is actually a deliberate rule (like a lightened leg day before a long run). If it still looks wrong, it's worth mentioning to whoever built this for you."]
]],
["What this app isn't",[
["Not medical advice","This app is a general fitness guide, not a substitute for a doctor or physical therapist. If you have an injury or health condition, check with them before starting, and the injury settings here are a starting point, not a clearance."],
["Not connected to Garmin, Apple Watch, or Apple Health","This app can't read or write to your watch or Apple Health. Web apps like this one aren't allowed to access that data on iPhone, so logging during a workout has to be done by hand here."],
["Not a social app","There's no sharing, friends list, or feed. Your data stays on your own phone and isn't visible to anyone else."],
["Not a certified coach","The plans follow common, evidence-based training guidelines, but nobody who built this app is a certified trainer or coach. For anything high-stakes, a real trainer reviewing your plan is worth it."]
]]
];

const mondayOf=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};

function stats(){
  const W=S.week,planned=W?W.days.filter(d=>d.lift||d.run).length:0,need=Math.max(1,Math.ceil(planned*.8)),by={},mo={},now=new Date();

  const cur=monday(),ok=m=>(by[m]?by[m].size:0)>=need;
  let streak=0,m=ok(cur)?cur:addW(cur,-1);while(ok(m)){streak++;m=addW(m,-1)}

  if(ks.length)for(let w=Math.min(...ks);w<=cur;w=addW(w,1)){if(ok(w)){run++;best=Math.max(best,run)}else if(w!==cur)run=0}

}

function recovery(now){

    const lid=logId();
    D.items.forEach((it,i)=>{const e=BY[it.id];
      if(isStr(e)){const ss=(D.sets||{})[i]||[],ok=ss.filter(x=>x.ok);if(ss.length)S.comp[it.id]=(S.comp[it.id]||[]).concat(ok.length/ss.length).slice(-3);
        if(ok.length){any=true;if(ok.length===ss.length)n++;
          const prior=bestPrior(it.id),sets=ok.map(x=>({w:+x.w||0,r:+x.r||0}));
          const H=S.hist[it.id]=S.hist[it.id]||[];H.push({t:Date.now(),sets,lid,int:it.int});if(H.length>20)H.splice(0,H.length-20);
          const tw=topW({sets});if(tw)w.push(it.name+" "+tw+" lb");
          if(tw&&prior&&tw>prior)prs.push(it.name+" "+tw+" lb");
          lifts.push({id:it.id,name:it.name,sets});
        }}
      else if(D.done[i])n++});
    if(D.done.r)n++;
    if(!any&&!n&&!D.mi)return;
    const mi=+D.mi||0,sec=tsec(D.sec)||0;
    if(mi>0){
      const priorMax=S.logs.reduce((a,l)=>Math.max(a,+l.mi||0),0);
      if(priorMax&&mi>priorMax)prs.push("Longest run "+mi+" mi");
      if(sec>0&&mi>=1){
        const priorPaces=S.logs.filter(l=>l.sec&&l.mi>=1).map(l=>l.sec/l.mi);
        if(priorPaces.length){const bestPace=Math.min(...priorPaces);if(sec/mi<bestPace)prs.push("Fastest pace "+fmtP(sec/mi)+" /mi")}
      }
    }
    S.logs.push({id:lid,t:Date.now(),plan:[D.lift,D.run&&D.run.type].filter(Boolean).join(" + "),n,of:D.items.length+(D.run?1:0),mi,sec,w:w.join(", "),lifts,prs});D.fin=true;
    if(prs.length){S.showPR=lid;S.tab="prog";window.scrollTo(0,0)}
  }
  else if(a.editlog!==undefined){S.editLog=a.editlog;S.scrollBack=window.scrollY;render();window.scrollTo(0,0);return}
  else if(t.hasAttribute("data-newlog")){S.editLog="new";S.scrollBack=window.scrollY;render();window.scrollTo(0,0);return}
  else if(t.hasAttribute("data-backlog")){S.editLog=null;RS=S.scrollBack;S.scrollBack=null}
  else if(t.hasAttribute("data-dellog")){
    if(!confirm("Delete this workout from your log?"))return;
    const id=a.dellog;S.logs=S.logs.filter(x=>x.id!==id);
    Object.keys(S.hist).forEach(k=>{S.hist[k]=S.hist[k].filter(e=>e.lid!==id)});
  }
  else if(t.hasAttribute("data-savelog")){saveLogEdit();window.scrollTo(0,S.scrollBack||0);S.scrollBack=null;return}
  else if(t.hasAttribute("data-dismisspr")){S.showPR=null}
  else if(t.hasAttribute("data-logall")){S.logAll=!S.logAll}
  else if(t.hasAttribute("data-backup")){backupNow();return}
  else if(t.hasAttribute("data-bksnooze")){S.bkSnooze=new Date().toDateString()}
  else if(t.hasAttribute("data-clear")){if(!confirm("Clear the log on this phone?"))return;S.logs=[]}
  else return;
  save();render();
  if(S.goFaq){S.goFaq=false;const f=$("#faq");if(f)f.scrollIntoView()}
  else if(RS!=null){window.scrollTo(0,RS);RS=null}
  else if(a.det||a.tab)window.scrollTo(0,0);
});

let apT=null,apPending=false,apMsgT=null;
function applyProfile(){
  apPending=false;
  if(!S.prof||!$("#goals"))return;
  try{
    const old=S.prof;S.prof=readProf();if(S.prof.restTimer===false&&S.rest){S.rest=null;drawRest()}rebuildWeek(old);save();
    const m=$("#apmsg");if(m){m.textContent="Week updated \u2713";clearTimeout(apMsgT);apMsgT=setTimeout(()=>{const m2=$("#apmsg");if(m2)m2.textContent=apMsg()},2000)}
  }catch(e){}
}
function flushApply(){if(apPending){clearTimeout(apT);applyProfile()}}
function scheduleApply(d){if(!S.prof||S.tab!=="profile"||!$("#goals"))return;apPending=true;clearTimeout(apT);apT=setTimeout(applyProfile,d)}

document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.g==="inj"){
    const cats=INJAV[t.value]||[];
    if(t.checked){
      cats.forEach(a=>{const box=document.querySelector(`[data-g="avoid"][value="${a}"]`);if(box&&!box.checked)box.checked=true});
    }else{
      const others=[...document.querySelectorAll('[data-g="inj"]:checked')].map(x=>x.value);
      cats.forEach(a=>{
        const stillNeeded=others.some(o=>(INJAV[o]||[]).includes(a));
        if(!stillNeeded){const box=document.querySelector(`[data-g="avoid"][value="${a}"]`);if(box)box.checked=false}
      });
    }
  }
});
